<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <head th:replace="fragments/base :: headFragment(
        'Contatti | Vercert',
        'Contatta il supporto Vercert per assistenza su certificati digitali, firma PAdES e verifica con QR code.',
        '/contact',
        'index,follow'
  )"></head>
    <title>Contatti | Vercert</title>
</head>
<body>
<header th:replace="fragments/base :: navFragment"></header>

<main class="container py-5" style="max-width: 860px;">
    <h1 class="fw-bold mb-2">Contatti</h1>
    <p class="text-muted mb-4">
        Invia una richiesta di assistenza: riceverai risposta all’indirizzo email indicato nel form.
    </p>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <form th:action="@{/contact}" th:object="${contactForm}" method="post" class="card shadow-sm border-0 rounded-4 p-4">
        <div class="mb-3">
            <label class="form-label">Nome</label>
            <input type="text" th:field="*{name}" class="form-control">
            <div class="text-danger small" th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" th:field="*{email}" class="form-control">
            <div class="text-danger small" th:errors="*{email}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Oggetto</label>
            <input type="text" th:field="*{subject}" class="form-control">
            <div class="text-danger small" th:errors="*{subject}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Messaggio</label>
            <textarea th:field="*{message}" class="form-control" rows="6"></textarea>
            <div class="text-danger small" th:errors="*{message}"></div>
        </div>
        <div>
            <button type="submit" class="btn btn-primary">Invia richiesta</button>
        </div>
    </form>
</main>
<div th:replace="fragments/footer :: footerFragment"></div>
</body>
</html>
